<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Inspection Report | AMIMTDE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        @media print {
            body * { visibility: hidden; }
            .report-container, .report-container * { visibility: visible; }
            .report-container { position: absolute; top: 0; left: 0; width: 100%; margin: 0; padding: 0; }
            .no-print { display: none !important; }
            .nav-bar, .filter-bar, .action-buttons, .summary-cards { display: none !important; }
            table th, table td { padding: 4px 6px !important; font-size: 0.7rem !important; border: 1px solid #b0b0b0 !important; }
            .table-wrapper { border-radius: 0 !important; }
            .manual-edit-btn { display: none !important; }
        }
        body { background: #f1f5f9; font-family: 'Inter', system-ui, sans-serif; }
        .nav-bar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 10px 24px; display: flex; align-items: center; gap: 4px; overflow-x: auto; }
        .nav-bar a { padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; color: #475569; white-space: nowrap; text-decoration: none; transition: all 0.15s; }
        .nav-bar a:hover { background: #f1f5f9; }
        .nav-bar a.active { background: #eef2ff; color: #4338ca; font-weight: 600; }
        .nav-brand { font-weight: 700; color: #1e293b; margin-right: 20px; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
        .table-wrapper { overflow-x: auto; border-radius: 1rem; position: relative; }
        .table-wrapper::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 24px; background: linear-gradient(to right, transparent, rgba(0,0,0,0.05)); pointer-events: none; border-radius: 0 1rem 1rem 0; }
        .table-wrapper::-webkit-scrollbar { height: 6px; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; border: 1px solid #d1d5db; }
        th { background: #f8fafc; position: sticky; top: 0; z-index: 10; padding: 12px 10px; font-weight: 600; border: 1px solid #d1d5db; border-bottom: 2px solid #b0b8c4; white-space: nowrap; font-size: 0.7rem; text-transform: uppercase; color: #475569; }
        td { padding: 8px 6px; border: 1px solid #d1d5db; vertical-align: middle; font-size: 0.8rem; }
        .summary-ribbon { background: white; border-radius: 1rem; border: 1px solid #eef2f6; padding: 1rem 1.5rem; display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: center; justify-content: center; }
        .summary-ribbon .metric { text-align: center; }
        .summary-ribbon .metric .label { font-size: 0.65rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.04em; }
        .summary-ribbon .metric .value { font-size: 1.35rem; font-weight: 700; color: #0f172a; line-height: 1.2; }
        .summary-ribbon .divider { width: 1px; height: 40px; background: #e2e8f0; }
        .filter-bar { background: white; border-radius: 1rem; padding: 1rem 1.25rem; border: 1px solid #eef2f6; }
        .filter-bar label { display: block; font-size: 0.65rem; font-weight: 600; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        .filter-input { width: 100%; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 0.6rem 0.9rem; font-size: 0.8rem; background: #fafbfc; color: #0f172a; }
        .filter-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); background: white; }
        .badge { display: inline-block; padding: 0.1rem 0.7rem; border-radius: 9999px; font-size: 0.65rem; font-weight: 600; }
        .badge-accepted { background: #dcfce7; color: #166534; }
        .col-delivered { background: #eff6ff; font-weight: 700; color: #1e40af; }
        .col-accepted { color: #166534; font-weight: 600; }
        .col-conditional { color: #6b21a8; font-weight: 600; }
        .cell-nowrap { white-space: nowrap; }
        .cell-drawing { white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; display: inline-block; font-size: 0.7rem; font-family: 'SF Mono', monospace; color: #475569; background: #f8fafc; padding: 1px 8px; border-radius: 999px; border: 1px solid #eef2f6; }
        .title-name { font-weight: 600; color: #0f172a; display: block; line-height: 1.3; margin-bottom: 4px; font-size: 0.85rem; }
        .sub-assembly-tag { font-size: 0.65rem; background: #eef2ff; color: #4338ca; padding: 0.1rem 0.7rem; border-radius: 9999px; display: inline-block; font-weight: 500; }
        .badge-card { background: #fafbfc; border-radius: 0.5rem; border: 1px solid #eef2f6; padding: 4px 10px 6px; display: inline-block; min-width: 130px; width: 100%; }
        .badge-card .stat-row { display: flex; justify-content: space-between; font-size: 0.65rem; line-height: 1.6; }
        .badge-card .stat-label { color: #94a3b8; font-weight: 500; }
        .badge-card .stat-value { font-weight: 700; color: #0f172a; }
        .badge-card .manual-tag { font-size: 0.55rem; font-weight: 700; color: #b45309; background: #fef3c7; padding: 0 6px; border-radius: 999px; border: 1px solid #fcd34d; text-transform: uppercase; margin-left: 4px; }
        .manual-edit-btn { background: none; border: none; color: #cbd5e1; cursor: pointer; padding: 2px 4px; font-size: 0.65rem; border-radius: 6px; }
        .manual-edit-btn:hover { color: #2563eb; background: #eef2ff; }
        .manual-edit-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px); z-index: 998; }
        .manual-edit-overlay.active { display: block; }
        .manual-edit-popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border-radius: 1.25rem; padding: 1.75rem 2rem 1.5rem; box-shadow: 0 24px 80px rgba(0,0,0,0.25); z-index: 999; min-width: 300px; max-width: 94vw; border: 1px solid #e2e8f0; }
        .manual-edit-popup.active { display: block; }
        .manual-edit-popup .popup-title { font-weight: 700; font-size: 1rem; color: #0f172a; margin-bottom: 2px; }
        .manual-edit-popup .popup-sub { font-size: 0.7rem; color: #94a3b8; word-break: break-all; margin-bottom: 1rem; padding: 4px 8px; background: #f8fafc; border-radius: 6px; }
        .manual-edit-popup label { font-size: 0.65rem; font-weight: 600; color: #475569; display: block; margin-top: 10px; text-transform: uppercase; }
        .manual-edit-popup input { width: 100%; border: 1px solid #d1d5db; border-radius: 0.6rem; padding: 8px 12px; font-size: 0.9rem; margin-top: 2px; background: #fafbfc; }
        .manual-edit-popup .popup-actions { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; }
        .manual-edit-popup .popup-actions button { padding: 7px 18px; border-radius: 0.6rem; font-size: 0.75rem; font-weight: 600; border: none; cursor: pointer; }
        .manual-edit-popup .btn-cancel { background: #f1f5f9; color: #475569; }
        .manual-edit-popup .btn-reset { background: #fef2f2; color: #b91c1c; }
        .manual-edit-popup .btn-save { background: #2563eb; color: white; }
        .loader { border: 3px solid #e2e8f0; border-top: 3px solid #3b82f6; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.7s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-icon { display: inline-flex; align-items: center; gap: 6px; }
        @media (max-width: 768px) {
            th, td { padding: 4px 4px; font-size: 0.7rem; }
            .col-hide-mobile { display: none; }
            .badge-card { min-width: 100px; }
            .cell-drawing { max-width: 100px; font-size: 0.6rem; }
        }
    </style>
</head>
<body>

    <div class="nav-bar no-print">
        <div class="nav-brand"><i class="fa-solid fa-industry"></i> AMIMTDE</div>
        <a href="/">Inspection</a>
        <a href="/list" class="active">Report</a>
        <a href="/up">Follow-Up</a>
        <a href="/dash">Assembly</a>
        <a href="/tools">QC Tools</a>
        <a href="/admin">Dashboard</a>
    </div>

    <div class="max-w-7xl mx-auto p-3 md:p-6">

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 md:p-5 mb-6 flex flex-wrap items-center justify-between gap-3 no-print">
            <div class="flex items-center gap-3">
                <div class="bg-blue-50 w-10 h-10 rounded-xl flex items-center justify-center text-blue-600"><i class="fa-solid fa-clipboard-list text-xl"></i></div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-slate-800">Inspection Report</h1>
                    <p class="text-xs text-gray-400 mt-0.5">First-op quantities per part · Assemblies excluded</p>
                </div>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="exportToExcelXLSX()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-sm btn-icon"><i class="fas fa-file-excel"></i> Excel</button>
                <button onclick="copyTableToClipboard()" class="bg-gray-600 hover:bg-gray-700 text-white px-3.5 py-2 rounded-xl text-sm btn-icon"><i class="fas fa-copy"></i> Copy</button>
                <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-sm btn-icon"><i class="fas fa-print"></i> Print</button>
                <button onclick="fetchReportData()" class="bg-slate-700 hover:bg-slate-800 text-white px-3.5 py-2 rounded-xl text-sm btn-icon"><i class="fas fa-sync-alt"></i> Refresh</button>
                <div class="relative">
                    <button onclick="document.getElementById('moreMenu').classList.toggle('hidden')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-sm"><i class="fas fa-ellipsis-h"></i></button>
                    <div id="moreMenu" class="hidden absolute right-0 mt-2 bg-white rounded-xl shadow-lg border border-gray-200 py-1 w-48 z-50">
                        <button onclick="clearAllManualOverrides(); document.getElementById('moreMenu').classList.add('hidden')" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50"><i class="fas fa-undo-alt mr-2"></i> Reset all overrides</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary ribbon with all 5 metrics -->
        <div class="summary-ribbon mb-6 no-print">
            <div class="metric"><div class="label">Delivered</div><div class="value text-blue-700" id="totalDeliveredSum">0</div></div>
            <div class="divider"></div>
            <div class="metric"><div class="label">Accepted</div><div class="value text-emerald-700" id="totalAcceptedSum">0</div></div>
            <div class="divider"></div>
            <div class="metric"><div class="label">Rework</div><div class="value text-amber-600" id="totalReworkSum">0</div></div>
            <div class="divider"></div>
            <div class="metric"><div class="label">Reject</div><div class="value text-red-600" id="totalRejectSum">0</div></div>
            <div class="divider"></div>
            <div class="metric"><div class="label">Conditional</div><div class="value text-purple-600" id="totalConditionalSum">0</div></div>
        </div>

        <div class="filter-bar no-print mb-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 items-end">
                <div><label><i class="fa-regular fa-folder-open"></i> Title</label><select id="projectFilterSelect" class="filter-input"><option value="">All Titles</option></select></div>
                <div><label><i class="fa-solid fa-gears"></i> Process</label><select id="processFilterSelect" class="filter-input"><option value="">All Processes</option></select></div>
                <div><label><i class="fa-solid fa-user"></i> QC Engineer</label><select id="engineerFilterSelect" class="filter-input"><option value="">All Engineers</option></select></div>
                <div><label><i class="fa-regular fa-magnifying-glass"></i> Search</label><input type="text" id="searchInput" placeholder="Parts, drawings, engineers…" class="filter-input" /></div>
                <div><button id="clearFiltersBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-5 py-2.5 rounded-xl text-sm font-medium btn-icon w-full justify-center"><i class="fas fa-eraser"></i> Clear</button></div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 report-container overflow-hidden">
            <div class="table-wrapper">
                <table id="reportTable">
                    <thead><tr>
                        <th class="text-left"><i class="fa-regular fa-user"></i> Client</th>
                        <th class="text-left" style="min-width:180px;"><i class="fa-regular fa-folder"></i> Title</th>
                        <th class="text-left" style="min-width:170px;"><i class="fa-regular fa-tag"></i> Subtitle</th>
                        <th class="text-left" style="min-width:170px;"><i class="fa-regular fa-cubes"></i> Sub Sub Assembly</th>
                        <th class="text-left cell-nowrap"><i class="fa-regular fa-cog"></i> Part</th>
                        <th class="text-left cell-nowrap col-hide-mobile"><i class="fa-regular fa-file-lines"></i> Drawing</th>
                        <th class="text-right bg-blue-50/60"><i class="fa-regular fa-box"></i> Delivered</th>
                        <th class="text-right col-hide-mobile"><i class="fa-regular fa-circle-check"></i> Accepted</th>
                        <th class="text-right col-hide-mobile"><i class="fa-regular fa-flag"></i> Conditional</th>
                    </tr></thead>
                    <tbody id="reportTableBody"><tr><td colspan="9" class="text-center py-12"><div class="loader"></div><p class="text-gray-400 text-sm mt-2">Loading…</p></td></tr></tbody>
                </table>
            </div>
            <div class="p-3 text-xs text-gray-400 border-t border-gray-100 flex justify-between items-center bg-gray-50/60 no-print">
                <span><i class="fa-regular fa-circle-info"></i> <span id="recordStatus">Ready</span></span>
                <span id="recordCount" class="font-medium text-gray-500"></span>
            </div>
        </div>
    </div>

    <div class="manual-edit-overlay" id="manualEditOverlay" onclick="closeManualEdit()"></div>
    <div class="manual-edit-popup" id="manualEditPopup"></div>

    <script>
        const TITLE_KEY = 'manualTitleOverrides';
        const SUBTITLE_KEY = 'manualSubtitleOverrides';
        const ASSEMBLY_KEY = 'manualSubAssemblyOverrides';
        const EXCLUDED = ['Assembling (welding)', 'Assembling (fastener)'];

        function isExcluded(p) {
            if (!p) return false;
            const l = p.trim().toLowerCase();
            return l.includes('assembling (welding)') || l.includes('assembling (fastener)') || l.includes('assembling(welding)') || l.includes('assembling(fastener)');
        }

        let serverOverrides = {};
        async function loadServerOverrides() {
            try { const r = await fetch('/api/overrides'); if (r.ok) serverOverrides = await r.json(); }
            catch { serverOverrides = {}; }
        }
        function getOverrides(key) {
            const prefix = key + '|';
            const map = {};
            for (const [k, v] of Object.entries(serverOverrides)) if (k.startsWith(prefix)) map[k.slice(prefix.length)] = v;
            if (Object.keys(map).length === 0) { try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : {}; } catch { return {}; } }
            return map;
        }
        async function saveOverride(level, id, parts, deliv) {
            const key = level === 'title' ? TITLE_KEY : level === 'subtitle' ? SUBTITLE_KEY : ASSEMBLY_KEY;
            if (!key) return;
            const fk = `${key}|${id}`;
            if (parts === undefined || deliv === undefined) {
                delete serverOverrides[fk];
                fetch('/api/overrides', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ level: key, id, parts: null, delivered: null }) }).catch(() => {});
                const o = (() => { try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch { return {}; } })();
                delete o[id]; localStorage.setItem(key, JSON.stringify(o));
            } else {
                serverOverrides[fk] = { parts: +parts, delivered: +deliv };
                fetch('/api/overrides', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ level: key, id, parts: +parts, delivered: +deliv }) }).catch(() => {});
                const o = (() => { try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch { return {}; } })();
                o[id] = { parts: +parts, delivered: +deliv }; localStorage.setItem(key, JSON.stringify(o));
            }
            applyFilters();
        }
        async function clearAllManualOverrides() {
            if (!confirm('Clear ALL manual overrides for every user? This cannot be undone.')) return;
            serverOverrides = {};
            localStorage.removeItem(TITLE_KEY); localStorage.removeItem(SUBTITLE_KEY); localStorage.removeItem(ASSEMBLY_KEY);
            await Promise.all([TITLE_KEY, SUBTITLE_KEY, ASSEMBLY_KEY].map(level => Promise.all(
                Object.keys(getOverrides(level)).map(id =>
                    fetch('/api/overrides', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ level, id, parts: null, delivered: null }) }).catch(() => {})
                )
            )));
            applyFilters();
        }

        function extra(insp, f) { return insp.extra_fields?.[f]?.trim() || ''; }
        function clientName(insp) { return (insp.customer_name && insp.customer_name.trim()) ? insp.customer_name.trim() : extra(insp, 'Customer Name'); }
        function projectName(insp) { return (insp.project_name && insp.project_name.trim()) ? insp.project_name.trim() : extra(insp, 'Project Name'); }
        function subtitle(insp) { return extra(insp, 'Subtitle'); }
        function subAssembly(insp) { return extra(insp, 'Sub Sub Assembly') || ''; }
        function fmt(v) { if (v === undefined || v === null || v === '') return '-'; const n = Number(v); return isNaN(n) ? '-' : n.toLocaleString(); }
        function num(v) { if (v === undefined || v === null || v === '') return 0; const n = Number(v); return isNaN(n) ? 0 : n; }
        function esc(s) { if (!s) return ''; return s.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

        let allRows = [];
        let projSet = new Set(), procSet = new Set(), engSet = new Set();

        async function fetchReportData() {
            const tbody = document.getElementById('reportTableBody');
            try {
                await loadServerOverrides();
                tbody.innerHTML = `<tr><td colspan="9" class="text-center py-12"><div class="loader"></div><p class="text-gray-400 text-sm mt-2">Fetching…</p></td></tr>`;
                document.getElementById('recordStatus').innerText = 'Loading…';
                const resp = await fetch('/api/inspections');
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                const rows = [];
                projSet.clear(); procSet.clear(); engSet.clear();
                let sumD = 0, sumA = 0, sumRw = 0, sumRej = 0, sumC = 0;
                const seenParts = new Set();
                for (const insp of data) {
                    const proc = insp.process_type || '';
                    if (isExcluded(proc)) continue;
                    const cl = clientName(insp) || '(no client)';
                    const pr = projectName(insp) || '(no title)';
                    const st = subtitle(insp) || '';
                    const sa = subAssembly(insp) || '';
                    const eng = insp.username || '';
                    const draw = extra(insp, 'Drawing No.') || '-';
                    const part = extra(insp, 'Part Name') || '-';
                    const acc = num(insp.accepted_qty);
                    const rw = num(insp.rework_qty);
                    const rej = num(insp.reject_qty);
                    const cond = num(insp.conditional_accept_qty);
                    const del = acc + rw + rej + cond;
                    const partKey = `${cl}|${pr}|${st}|${sa}|${part}`;
                    const isFirst = !seenParts.has(partKey);
                    if (isFirst) { seenParts.add(partKey); sumD += del; sumA += acc; sumRw += rw; sumRej += rej; sumC += cond; }
                    if (pr) projSet.add(pr); if (proc) procSet.add(proc); if (eng) engSet.add(eng);
                    rows.push({ client: cl, project: pr, subtitle: st, subAssembly: sa, drawing: draw, part, delivered: fmt(del), deliveredRaw: del, accepted: fmt(acc), acceptedRaw: acc, reworkRaw: rw, rejectRaw: rej, conditional: fmt(cond), conditionalRaw: cond, process: proc, engineer: eng, search: `${cl} ${pr} ${st} ${sa} ${draw} ${part} ${del} ${acc} ${cond} ${proc} ${eng}`.toLowerCase(), isFirstOp: isFirst });
                }
                document.getElementById('totalDeliveredSum').innerText = sumD.toLocaleString();
                document.getElementById('totalAcceptedSum').innerText = sumA.toLocaleString();
                document.getElementById('totalReworkSum').innerText = sumRw.toLocaleString();
                document.getElementById('totalRejectSum').innerText = sumRej.toLocaleString();
                document.getElementById('totalConditionalSum').innerText = sumC.toLocaleString();
                const pSel = document.getElementById('projectFilterSelect');
                pSel.innerHTML = '<option value="">All Titles</option>';
                [...projSet].sort().forEach(v => { pSel.innerHTML += `<option value="${esc(v)}">${esc(v)}</option>`; });
                const prSel = document.getElementById('processFilterSelect');
                prSel.innerHTML = '<option value="">All Processes</option>';
                [...procSet].sort().forEach(v => { prSel.innerHTML += `<option value="${esc(v)}">${esc(v)}</option>`; });
                const eSel = document.getElementById('engineerFilterSelect');
                eSel.innerHTML = '<option value="">All Engineers</option>';
                [...engSet].sort().forEach(v => { eSel.innerHTML += `<option value="${esc(v)}">${esc(v)}</option>`; });
                allRows = rows;
                applyFilters();
                document.getElementById('recordStatus').innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500"></i> ${rows.length} records · assemblies excluded`;
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="9" class="text-center py-12 text-red-500"><i class="fa-regular fa-circle-exclamation text-2xl"></i><p class="mt-2 text-sm">Error: ${err.message}</p></td></tr>`;
                document.getElementById('recordStatus').innerText = 'Error';
            }
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const proj = document.getElementById('projectFilterSelect').value;
            const proc = document.getElementById('processFilterSelect').value;
            const eng = document.getElementById('engineerFilterSelect').value;
            let filtered = [...allRows];
            if (proj) filtered = filtered.filter(r => r.project === proj);
            if (proc) filtered = filtered.filter(r => r.process === proc);
            if (eng) filtered = filtered.filter(r => r.engineer === eng);
            if (search) filtered = filtered.filter(r => r.search.includes(search));
            renderAggregated(filtered);
        }

        function metaBadge(parts, deliv, isManual, origParts, origDeliv) {
            const avgUnits = parts > 0 ? (deliv / parts) : 0;
            const actualAvg = origParts > 0 ? (origDeliv / origParts) : 0;
            const manualTag = isManual ? `<span class="manual-tag">manual</span>` : '';
            const actual = isManual ? `<div class="text-[0.55rem] text-slate-400 mt-1">actual: ${actualAvg.toFixed(1)} u/p</div>` : '';
            return `<div class="badge-card">
                <div class="stat-row"><span class="stat-label">Parts</span><span class="stat-value">${parts}</span></div>
                <div class="stat-row"><span class="stat-label">Delivered</span><span class="stat-value">${fmt(deliv)}</span></div>
                <div class="stat-row"><span class="stat-label">Avg/part</span><span class="stat-value">${avgUnits.toFixed(1)}</span></div>
                ${actual}${manualTag}
            </div>`;
        }

        function renderAggregated(rows) {
            const tbody = document.getElementById('reportTableBody');
            if (!rows.length) {
                tbody.innerHTML = `<tr><td colspan="9" class="text-center py-12 text-gray-400"><div class="text-4xl mb-2"><i class="fa-regular fa-face-smile"></i></div><p class="text-sm mb-1">No results for these filters.</p><p class="text-xs">Assemblies excluded by design.</p><button onclick="clearFilters()" class="mt-3 text-indigo-600 underline text-xs">Clear filters</button></td></tr>`;
                document.getElementById('recordCount').innerText = '0 parts';
                return;
            }
            const cm = new Map();
            for (const r of rows) {
                const c = r.client;
                if (!cm.has(c)) cm.set(c, { client: c, titles: new Map() });
                const ce = cm.get(c);
                const t = r.project;
                if (!ce.titles.has(t)) ce.titles.set(t, { title: t, subtitles: new Map(), parts: new Set(), deliv: 0 });
                const te = ce.titles.get(t);
                const s = r.subtitle || '';
                if (!te.subtitles.has(s)) te.subtitles.set(s, { subtitle: s, assemblies: new Map() });
                const se = te.subtitles.get(s);
                const a = r.subAssembly || '';
                if (!se.assemblies.has(a)) se.assemblies.set(a, { assembly: a, parts: new Map() });
                const ae = se.assemblies.get(a);
                const p = r.part;
                if (!ae.parts.has(p)) ae.parts.set(p, { part: p, deliv: 0, acc: 0, rw: 0, rej: 0, cond: 0, drawings: new Set(), firstSeen: false });
                const pe = ae.parts.get(p);
                if (!pe.firstSeen) { pe.deliv += r.deliveredRaw; pe.acc += r.acceptedRaw; pe.rw += r.reworkRaw; pe.rej += r.rejectRaw; pe.cond += r.conditionalRaw; pe.firstSeen = true; }
                if (r.drawing && r.drawing !== '-') pe.drawings.add(r.drawing);
            }
            for (const ce of cm.values()) for (const te of ce.titles.values()) {
                let tP = new Set(), tD = 0;
                for (const se of te.subtitles.values()) {
                    let sP = new Set(), sD = 0;
                    for (const ae of se.assemblies.values()) {
                        let aP = new Set(), aD = 0;
                        for (const pe of ae.parts.values()) if (pe.deliv > 0) { aP.add(pe.part); aD += pe.deliv; }
                        ae.partsSet = aP; ae.totalDeliv = aD;
                        sP = new Set([...sP, ...aP]); sD += aD;
                    }
                    se.partsSet = sP; se.totalDeliv = sD;
                    tP = new Set([...tP, ...sP]); tD += sD;
                }
                te.partsSet = tP; te.totalDeliv = tD;
            }
            const oT = getOverrides(TITLE_KEY), oS = getOverrides(SUBTITLE_KEY), oA = getOverrides(ASSEMBLY_KEY);
            for (const ce of cm.values()) for (const te of ce.titles.values()) {
                const m = oT[te.title];
                if (m) { te.partsSet = new Set(Array(m.parts).fill('manual')); te.totalDeliv = m.delivered; }
                for (const se of te.subtitles.values()) {
                    const sid = `${ce.client}|${te.title}|${se.subtitle}`;
                    const m2 = oS[sid];
                    if (m2) { se.partsSet = new Set(Array(m2.parts).fill('manual')); se.totalDeliv = m2.delivered; }
                    for (const ae of se.assemblies.values()) {
                        const aid = `${ce.client}|${te.title}|${se.subtitle}|${ae.assembly}`;
                        const m3 = oA[aid];
                        if (m3) { ae.partsSet = new Set(Array(m3.parts).fill('manual')); ae.totalDeliv = m3.delivered; }
                    }
                }
            }
            const countParts = ae => { let c = 0; for (const pe of ae.parts.values()) if (pe.deliv > 0) c++; return c; };
            const rowsAsm = ae => countParts(ae);
            const rowsSub = se => { let s = 0; for (const ae of se.assemblies.values()) s += rowsAsm(ae); return s; };
            const rowsTitle = te => { let s = 0; for (const se of te.subtitles.values()) s += rowsSub(se); return s; };
            const rowsClient = ce => { let s = 0; for (const te of ce.titles.values()) s += rowsTitle(te); return s; };
            let html = '', totalParts = 0;
            for (const ce of cm.values()) {
                const cTotal = rowsClient(ce);
                let cPrinted = false;
                for (const te of ce.titles.values()) {
                    const tTotal = rowsTitle(te);
                    let tPrinted = false;
                    const tP = te.partsSet.size, tD = te.totalDeliv;
                    let dispTP = tP, dispTD = tD, isTM = false;
                    const tMan = oT[te.title];
                    if (tMan) { dispTP = tMan.parts; dispTD = tMan.delivered; isTM = true; }
                    const tBadge = metaBadge(dispTP, dispTD, isTM, tP, tD);
                    for (const se of te.subtitles.values()) {
                        const sTotal = rowsSub(se);
                        let sPrinted = false;
                        const sP = se.partsSet.size, sD = se.totalDeliv;
                        let dispSP = sP, dispSD = sD, isSM = false;
                        const sId = `${ce.client}|${te.title}|${se.subtitle}`;
                        const sMan = oS[sId];
                        if (sMan) { dispSP = sMan.parts; dispSD = sMan.delivered; isSM = true; }
                        const sBadge = metaBadge(dispSP, dispSD, isSM, sP, sD);
                        for (const ae of se.assemblies.values()) {
                            const aTotal = rowsAsm(ae);
                            let aPrinted = false;
                            const aP = ae.partsSet.size, aD = ae.totalDeliv;
                            let dispAP = aP, dispAD = aD, isAM = false;
                            const aId = `${ce.client}|${te.title}|${se.subtitle}|${ae.assembly}`;
                            const aMan = oA[aId];
                            if (aMan) { dispAP = aMan.parts; dispAD = aMan.delivered; isAM = true; }
                            const aBadge = metaBadge(dispAP, dispAD, isAM, aP, aD);
                            for (const pe of ae.parts.values()) {
                                if (pe.deliv === 0) continue;
                                totalParts++;
                                html += `<tr class="hover:bg-gray-50/70">`;
                                if (!cPrinted) { html += `<td rowspan="${cTotal}" class="font-semibold align-middle text-slate-700">${esc(ce.client)}</td>`; cPrinted = true; }
                                if (!tPrinted) { html += `<td rowspan="${tTotal}" class="align-top"><div class="title-name">${esc(te.title)}</div>${tBadge}<button class="manual-edit-btn" onclick="openManualEdit('title','${esc(te.title)}',${dispTP},${dispTD})" title="Override"><i class="fa-regular fa-pen-to-square"></i></button></td>`; tPrinted = true; }
                                if (!sPrinted) { html += `<td rowspan="${sTotal}" class="align-top"><div class="text-sm font-medium text-gray-600">${esc(se.subtitle) || '—'}</div>${sBadge}<button class="manual-edit-btn" onclick="openManualEdit('subtitle','${esc(sId)}',${dispSP},${dispSD})" title="Override"><i class="fa-regular fa-pen-to-square"></i></button></td>`; sPrinted = true; }
                                if (!aPrinted) { html += `<td rowspan="${aTotal}" class="align-top"><div class="sub-assembly-tag">${esc(ae.assembly) || '—'}</div>${aBadge}<button class="manual-edit-btn" onclick="openManualEdit('assembly','${esc(aId)}',${dispAP},${dispAD})" title="Override"><i class="fa-regular fa-pen-to-square"></i></button></td>`; aPrinted = true; }
                                const draws = [...pe.drawings].sort().join(', ');
                                html += `<td class="cell-nowrap font-medium">${esc(pe.part)}</td><td class="col-hide-mobile"><span class="cell-drawing" title="${esc(draws) || '—'}">${esc(draws) || '—'}</span></td><td class="text-right tabular-nums font-bold text-blue-700 col-delivered">${fmt(pe.deliv)}</td><td class="text-right tabular-nums col-accepted col-hide-mobile">${fmt(pe.acc)}</td><td class="text-right tabular-nums col-conditional col-hide-mobile">${fmt(pe.cond)}</td></tr>`;
                            }
                        }
                    }
                }
            }
            if (totalParts === 0) { tbody.innerHTML = `<tr><td colspan="9" class="text-center py-12 text-gray-400">No parts with delivered quantity.</td></tr>`; document.getElementById('recordCount').innerText = '0 parts'; }
            else { tbody.innerHTML = html; document.getElementById('recordCount').innerText = `${totalParts} parts · ${rows.length} records`; }
        }

        function openManualEdit(level, id, curParts, curDeliv) {
            const labels = { title: 'Title', subtitle: 'Subtitle', assembly: 'Sub Sub Assembly' };
            const popup = document.getElementById('manualEditPopup');
            document.getElementById('manualEditOverlay').classList.add('active');
            popup.classList.add('active');
            popup.innerHTML = `
                <div class="popup-title"><i class="fa-regular fa-pen-to-square text-amber-500 mr-2"></i>Override — ${labels[level]}</div>
                <div class="popup-sub">${esc(id)}</div>
                <label><i class="fa-regular fa-cubes mr-1"></i> Parts (unique)</label>
                <input type="number" id="manualPartsInput" value="${curParts}" min="0" step="1" />
                <label><i class="fa-regular fa-box mr-1"></i> Delivered (total)</label>
                <input type="number" id="manualDelivInput" value="${curDeliv}" min="0" step="1" />
                <div class="popup-actions">
                    <button class="btn-cancel" onclick="closeManualEdit()">Cancel</button>
                    <button class="btn-reset" onclick="saveOverride('${level}','${esc(id)}',undefined,undefined); closeManualEdit();">Reset</button>
                    <button class="btn-save" onclick="saveOverride('${level}','${esc(id)}', parseInt(document.getElementById('manualPartsInput').value) || 0, parseInt(document.getElementById('manualDelivInput').value) || 0); closeManualEdit();"><i class="fa-regular fa-floppy-disk mr-1"></i>Save</button>
                </div>`;
            setTimeout(() => document.getElementById('manualPartsInput')?.focus(), 50);
        }
        function closeManualEdit() {
            document.getElementById('manualEditOverlay').classList.remove('active');
            document.getElementById('manualEditPopup').classList.remove('active');
        }

        function exportToExcelXLSX() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const proj = document.getElementById('projectFilterSelect').value;
            const proc = document.getElementById('processFilterSelect').value;
            const eng = document.getElementById('engineerFilterSelect').value;
            let filtered = [...allRows];
            if (proj) filtered = filtered.filter(r => r.project === proj);
            if (proc) filtered = filtered.filter(r => r.process === proc);
            if (eng) filtered = filtered.filter(r => r.engineer === eng);
            if (search) filtered = filtered.filter(r => r.search.includes(search));
            const cm = new Map();
            for (const r of filtered) {
                const c = r.client;
                if (!cm.has(c)) cm.set(c, { client: c, titles: new Map() });
                const ce = cm.get(c);
                const t = r.project;
                if (!ce.titles.has(t)) ce.titles.set(t, { title: t, subtitles: new Map(), parts: new Set(), deliv: 0 });
                const te = ce.titles.get(t);
                const s = r.subtitle || '';
                if (!te.subtitles.has(s)) te.subtitles.set(s, { subtitle: s, assemblies: new Map() });
                const se = te.subtitles.get(s);
                const a = r.subAssembly || '';
                if (!se.assemblies.has(a)) se.assemblies.set(a, { assembly: a, parts: new Map() });
                const ae = se.assemblies.get(a);
                const p = r.part;
                if (!ae.parts.has(p)) ae.parts.set(p, { part: p, deliv: 0, acc: 0, rw: 0, rej: 0, cond: 0, drawings: new Set(), firstSeen: false });
                const pe = ae.parts.get(p);
                if (!pe.firstSeen) { pe.deliv += r.deliveredRaw; pe.acc += r.acceptedRaw; pe.rw += r.reworkRaw; pe.rej += r.rejectRaw; pe.cond += r.conditionalRaw; pe.firstSeen = true; }
                if (r.drawing && r.drawing !== '-') pe.drawings.add(r.drawing);
            }
            for (const ce of cm.values()) for (const te of ce.titles.values()) {
                let tP = new Set(), tD = 0;
                for (const se of te.subtitles.values()) {
                    let sP = new Set(), sD = 0;
                    for (const ae of se.assemblies.values()) {
                        let aP = new Set(), aD = 0;
                        for (const pe of ae.parts.values()) if (pe.deliv > 0) { aP.add(pe.part); aD += pe.deliv; }
                        ae.partsSet = aP; ae.totalDeliv = aD;
                        sP = new Set([...sP, ...aP]); sD += aD;
                    }
                    se.partsSet = sP; se.totalDeliv = sD;
                    tP = new Set([...tP, ...sP]); tD += sD;
                }
                te.partsSet = tP; te.totalDeliv = tD;
            }
            const oT = getOverrides(TITLE_KEY), oS = getOverrides(SUBTITLE_KEY), oA = getOverrides(ASSEMBLY_KEY);
            for (const ce of cm.values()) for (const te of ce.titles.values()) {
                const m = oT[te.title]; if (m) { te.partsSet = new Set(Array(m.parts).fill('manual')); te.totalDeliv = m.delivered; }
                for (const se of te.subtitles.values()) {
                    const sid = `${ce.client}|${te.title}|${se.subtitle}`; const m2 = oS[sid];
                    if (m2) { se.partsSet = new Set(Array(m2.parts).fill('manual')); se.totalDeliv = m2.delivered; }
                    for (const ae of se.assemblies.values()) {
                        const aid = `${ce.client}|${te.title}|${se.subtitle}|${ae.assembly}`; const m3 = oA[aid];
                        if (m3) { ae.partsSet = new Set(Array(m3.parts).fill('manual')); ae.totalDeliv = m3.delivered; }
                    }
                }
            }
            const headers = ['Client','Title','Title #Parts','Title Total','Title Avg/part','Subtitle','Sub #Parts','Sub Total','Sub Avg/part','Sub Sub Assembly','Sub Sub #Parts','Sub Sub Total','Sub Sub Avg/part','Part','Drawing','Delivered','Accepted','Rework','Reject','Conditional'];
            const data = [headers];
            for (const ce of cm.values()) for (const te of ce.titles.values()) {
                const tP = te.partsSet.size, tD = te.totalDeliv, tA = tP > 0 ? (tD / tP) : 0;
                for (const se of te.subtitles.values()) {
                    const sP = se.partsSet.size, sD = se.totalDeliv, sA = sP > 0 ? (sD / sP) : 0;
                    for (const ae of se.assemblies.values()) {
                        const aP = ae.partsSet.size, aD = ae.totalDeliv, aA = aP > 0 ? (aD / aP) : 0;
                        for (const pe of ae.parts.values()) {
                            if (pe.deliv === 0) continue;
                            const d = [...pe.drawings].sort().join(', ');
                            data.push([ce.client, te.title, tP, fmt(tD), tA.toFixed(1), se.subtitle, sP, fmt(sD), sA.toFixed(1), ae.assembly, aP, fmt(aD), aA.toFixed(1), pe.part, d || '—', fmt(pe.deliv), fmt(pe.acc), fmt(pe.rw), fmt(pe.rej), fmt(pe.cond)]);
                        }
                    }
                }
            }
            if (data.length === 1) { alert('No parts to export.'); return; }
            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [{wch:18},{wch:22},{wch:14},{wch:16},{wch:14},{wch:20},{wch:14},{wch:16},{wch:14},{wch:20},{wch:14},{wch:16},{wch:14},{wch:20},{wch:25},{wch:14},{wch:12},{wch:12},{wch:12},{wch:14}];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Inspection Report');
            XLSX.writeFile(wb, `inspection_report_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.xlsx`);
        }

        async function copyTableToClipboard() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const proj = document.getElementById('projectFilterSelect').value;
            const proc = document.getElementById('processFilterSelect').value;
            const eng = document.getElementById('engineerFilterSelect').value;
            let filtered = [...allRows];
            if (proj) filtered = filtered.filter(r => r.project === proj);
            if (proc) filtered = filtered.filter(r => r.process === proc);
            if (eng) filtered = filtered.filter(r => r.engineer === eng);
            if (search) filtered = filtered.filter(r => r.search.includes(search));
            let tsv = "Client\tTitle\tSubtitle\tSub-Sub\tPart\tDrawing\tDelivered\tAccepted\tRework\tReject\tConditional\n";
            for (const r of filtered) {
                if (r.isFirstOp) tsv += `${r.client}\t${r.project}\t${r.subtitle}\t${r.subAssembly}\t${r.part}\t${r.drawing}\t${r.delivered}\t${r.accepted}\t${r.reworkRaw}\t${r.rejectRaw}\t${r.conditional}\n`;
            }
            try { await navigator.clipboard.writeText(tsv); alert('Table copied'); } catch (err) { alert('Copy failed: ' + err); }
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('projectFilterSelect').value = '';
            document.getElementById('processFilterSelect').value = '';
            document.getElementById('engineerFilterSelect').value = '';
            applyFilters();
        }
        document.getElementById('searchInput').addEventListener('input', () => { if (allRows.length) applyFilters(); });
        document.getElementById('projectFilterSelect').addEventListener('change', () => { if (allRows.length) applyFilters(); });
        document.getElementById('processFilterSelect').addEventListener('change', () => { if (allRows.length) applyFilters(); });
        document.getElementById('engineerFilterSelect').addEventListener('change', () => { if (allRows.length) applyFilters(); });
        document.getElementById('clearFiltersBtn').addEventListener('click', clearFilters);
        document.addEventListener('click', e => { if (!e.target.closest('.relative')) document.getElementById('moreMenu')?.classList.add('hidden'); });
        fetchReportData();
    </script>
