<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Inspection Report | Amhara Metal Industry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @media print {
            body * { visibility: hidden; }
            .report-container, .report-container * { visibility: visible; }
            .report-container { position: absolute; top: 0; left: 0; width: 100%; margin: 0; padding: 0; }
            .no-print { display: none; }
            .summary-cards { display: none; }
            .filter-bar, .action-buttons { display: none; }
            table th, table td { padding: 6px; }
        }
        .table-wrapper { overflow-x: auto; border-radius: 1rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background-color: #f1f5f9; position: sticky; top: 0; z-index: 10; padding: 12px 10px; font-weight: 600; color: #0f172a; }
        td { padding: 10px 8px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
        tr:hover td { background-color: #f8fafc; }
        .summary-card { transition: all 0.2s; border-radius: 1rem; }
        .summary-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .filter-input:focus { outline: none; ring: 2px solid #3b82f6; border-color: transparent; }
        .loader {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 font-sans">

<div class="max-w-7xl mx-auto p-4 md:p-6">
    <!-- Header -->
    <div class="bg-white rounded-2xl shadow-md p-5 mb-6 flex flex-wrap justify-between items-center border border-gray-100">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-clipboard-list text-blue-600"></i> 
                Inspection Report
            </h1>
            <p class="text-gray-500 text-sm mt-1">Hierarchical view: Client → Title → Subtitle → Parts</p>
        </div>
        <div class="flex flex-wrap gap-2 mt-3 md:mt-0 no-print">
            <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm shadow-sm transition flex items-center gap-2">
                <i class="fas fa-file-excel"></i> Excel
            </button>
            <button onclick="copyTableToClipboard()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-xl text-sm shadow-sm transition flex items-center gap-2">
                <i class="fas fa-copy"></i> Copy
            </button>
            <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm shadow-sm transition flex items-center gap-2">
                <i class="fas fa-print"></i> Print
            </button>
            <button onclick="fetchReportData()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-sm shadow-sm transition flex items-center gap-2">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>
    </div>

    <!-- Summary Cards (unchanged) -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4 mb-6 no-print">
        <div class="summary-card bg-white p-4 shadow-sm border border-gray-100">
            <div class="flex items-center justify-between">
                <div><i class="fa-solid fa-cubes text-2xl text-blue-500"></i></div>
                <span class="text-xs text-gray-400">Total</span>
            </div>
            <p class="text-2xl font-bold text-slate-800 mt-2" id="totalDeliveredSum">0</p>
            <p class="text-xs text-gray-500">Delivered Qty</p>
        </div>
        <div class="summary-card bg-white p-4 shadow-sm border border-gray-100">
            <div class="flex items-center justify-between">
                <div><i class="fa-solid fa-check-circle text-2xl text-emerald-500"></i></div>
            </div>
            <p class="text-2xl font-bold text-slate-800 mt-2" id="totalAcceptedSum">0</p>
            <p class="text-xs text-gray-500">Accepted</p>
        </div>
        <div class="summary-card bg-white p-4 shadow-sm border border-gray-100">
            <div class="flex items-center justify-between">
                <div><i class="fa-solid fa-rotate-left text-2xl text-amber-500"></i></div>
            </div>
            <p class="text-2xl font-bold text-slate-800 mt-2" id="totalReworkSum">0</p>
            <p class="text-xs text-gray-500">Rework</p>
        </div>
        <div class="summary-card bg-white p-4 shadow-sm border border-gray-100">
            <div class="flex items-center justify-between">
                <div><i class="fa-solid fa-ban text-2xl text-red-500"></i></div>
            </div>
            <p class="text-2xl font-bold text-slate-800 mt-2" id="totalRejectSum">0</p>
            <p class="text-xs text-gray-500">Reject</p>
        </div>
        <div class="summary-card bg-white p-4 shadow-sm border border-gray-100">
            <div class="flex items-center justify-between">
                <div><i class="fa-solid fa-flag-checkered text-2xl text-purple-500"></i></div>
            </div>
            <p class="text-2xl font-bold text-slate-800 mt-2" id="totalConditionalSum">0</p>
            <p class="text-xs text-gray-500">Conditional</p>
        </div>
    </div>

    <!-- Filter Bar -->
    <div class="bg-white rounded-xl shadow-sm p-4 mb-5 no-print flex flex-col md:flex-row gap-4 items-end">
        <div class="flex-1">
            <label class="block text-xs font-medium text-gray-600 mb-1"><i class="fa-regular fa-folder-open mr-1"></i> Filter by Project (Title)</label>
            <select id="projectFilterSelect" class="filter-input w-full md:w-80 border border-gray-200 rounded-xl px-4 py-2.5 bg-gray-50 focus:bg-white transition">
                <option value="">All Titles</option>
            </select>
        </div>
        <div class="flex-1">
            <label class="block text-xs font-medium text-gray-600 mb-1"><i class="fa-regular fa-magnifying-glass mr-1"></i> Search (Client, Title, Subtitle, Drawing, Part, Qty)</label>
            <input type="text" id="searchInput" placeholder="Type anything..." class="filter-input w-full border border-gray-200 rounded-xl px-4 py-2.5 bg-gray-50 focus:bg-white transition">
        </div>
        <div>
            <button id="clearFiltersBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-5 py-2.5 rounded-xl text-sm font-medium transition flex items-center gap-2">
                <i class="fas fa-eraser"></i> Clear filters
            </button>
        </div>
    </div>

    <!-- Main Table Container -->
    <div class="bg-white rounded-2xl shadow-md overflow-hidden report-container border border-gray-100">
        <div class="table-wrapper">
            <table id="reportTable" class="min-w-full">
                <thead>
                    <tr class="border-b border-gray-200">
                        <th class="text-left">👤 Client Name</th>
                        <th class="text-left">📁 Title</th>
                        <th class="text-left">🔖 Subtitle</th>
                        <th class="text-left">📄 Drawing No.</th>
                        <th class="text-left">🔧 Part Name</th>
                        <th class="text-right">📦 Delivered</th>
                        <th class="text-right">✅ Accepted</th>
                        <th class="text-right">🔄 Rework</th>
                        <th class="text-right">❌ Reject</th>
                        <th class="text-right">⚠️ Conditional</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody">
                    <tr><td colspan="10" class="text-center py-12"><div class="loader"></div><p class="text-gray-500 mt-2">Loading inspections...</p></td></tr>
                </tbody>
            </table>
        </div>
        <div id="reportInfo" class="p-4 text-sm text-gray-500 border-t border-gray-100 flex justify-between items-center bg-gray-50 no-print">
            <span><i class="fa-regular fa-chart-line"></i> <span id="recordStatus">Ready</span></span>
            <span id="recordCount" class="font-medium"></span>
        </div>
    </div>
</div>

<script>
    // ---------- Helper functions ----------
    function getExtraField(inspection, fieldName) {
        return inspection.extra_fields?.[fieldName]?.trim() || '';
    }

    function getClientName(inspection) {
        if (inspection.customer_name) return inspection.customer_name.trim();
        return getExtraField(inspection, 'Customer Name');
    }

    function getProjectName(inspection) {
        if (inspection.project_name) return inspection.project_name.trim();
        return getExtraField(inspection, 'Project Name');
    }

    function getSubtitle(inspection) {
        return getExtraField(inspection, 'Subtitle');
    }

    let allReportRows = [];
    let uniqueProjectNames = new Set();

    function formatQty(value) {
        if (value === undefined || value === null || value === '') return '-';
        const num = Number(value);
        return isNaN(num) ? '-' : num.toLocaleString();
    }

    function numericQty(value) {
        if (value === undefined || value === null || value === '') return 0;
        const num = Number(value);
        return isNaN(num) ? 0 : num;
    }

    async function fetchReportData() {
        const tbody = document.getElementById('reportTableBody');
        const statusSpan = document.getElementById('recordStatus');
        try {
            tbody.innerHTML = `<tr><td colspan="10" class="text-center py-12"><div class="loader"></div><p class="text-gray-500 mt-2">Fetching inspections...</p></td></tr>`;
            statusSpan.innerText = 'Loading...';
            const response = await fetch('/api/inspections');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const inspections = await response.json();
            
            const rows = [];
            uniqueProjectNames.clear();
            let sumDelivered = 0, sumAccepted = 0, sumRework = 0, sumReject = 0, sumConditional = 0;
            
            for (const insp of inspections) {
                const clientName = getClientName(insp) || '';
                const projectName = getProjectName(insp) || '';
                const subtitle = getSubtitle(insp) || '';
                if (projectName) uniqueProjectNames.add(projectName);
                
                const drawingNo = getExtraField(insp, 'Drawing No.') || '-';
                const partName = getExtraField(insp, 'Part Name') || '-';
                const deliveredRaw = insp.delivered_qty;
                const acceptedRaw = insp.accepted_qty;
                const reworkRaw = insp.rework_qty;
                const rejectRaw = insp.reject_qty;
                const conditionalRaw = insp.conditional_accept_qty;
                
                const delivered = formatQty(deliveredRaw);
                const accepted = formatQty(acceptedRaw);
                const rework = formatQty(reworkRaw);
                const reject = formatQty(rejectRaw);
                const conditional = formatQty(conditionalRaw);
                
                sumDelivered += numericQty(deliveredRaw);
                sumAccepted += numericQty(acceptedRaw);
                sumRework += numericQty(reworkRaw);
                sumReject += numericQty(rejectRaw);
                sumConditional += numericQty(conditionalRaw);
                
                rows.push({
                    clientName,
                    projectName,
                    subtitle,
                    drawingNo,
                    partName,
                    delivered,
                    accepted,
                    rework,
                    reject,
                    conditional,
                    rawSearch: `${clientName} ${projectName} ${subtitle} ${drawingNo} ${partName} ${delivered} ${accepted} ${rework} ${reject} ${conditional}`.toLowerCase()
                });
            }
            
            document.getElementById('totalDeliveredSum').innerText = sumDelivered.toLocaleString();
            document.getElementById('totalAcceptedSum').innerText = sumAccepted.toLocaleString();
            document.getElementById('totalReworkSum').innerText = sumRework.toLocaleString();
            document.getElementById('totalRejectSum').innerText = sumReject.toLocaleString();
            document.getElementById('totalConditionalSum').innerText = sumConditional.toLocaleString();
            
            const projectSelect = document.getElementById('projectFilterSelect');
            projectSelect.innerHTML = '<option value="">All Titles</option>';
            [...uniqueProjectNames].sort().forEach(proj => {
                projectSelect.innerHTML += `<option value="${escapeHtml(proj)}">${escapeHtml(proj)}</option>`;
            });
            
            allReportRows = rows;
            applyFilters();
            statusSpan.innerText = `✅ Loaded ${rows.length} records`;
        } catch (err) {
            console.error(err);
            tbody.innerHTML = `<td><td colspan="10" class="text-center py-12 text-red-500"><i class="fas fa-exclamation-triangle text-2xl"></i><p class="mt-2">Error loading data. Make sure backend API is running at /api/inspections</p></td></tr>`;
            statusSpan.innerText = '❌ Error';
        }
    }
    
    function applyFilters() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const selectedProject = document.getElementById('projectFilterSelect').value;
        
        let filtered = [...allReportRows];
        if (selectedProject) {
            filtered = filtered.filter(row => row.projectName === selectedProject);
        }
        if (searchTerm) {
            filtered = filtered.filter(row => row.rawSearch.includes(searchTerm));
        }
        renderHierarchicalTable(filtered);
        const countSpan = document.getElementById('recordCount');
        const total = allReportRows.length;
        countSpan.innerText = `Showing ${filtered.length} of ${total} records`;
    }
    
    // Hierarchical grouping: Client -> Title -> Subtitle -> parts
    function renderHierarchicalTable(rows) {
        const tbody = document.getElementById('reportTableBody');
        if (!rows.length) {
            tbody.innerHTML = `<td><td colspan="10" class="text-center py-12 text-gray-400"><i class="fa-regular fa-face-frown text-2xl"></i><p class="mt-2">No matching records</p></td></tr>`;
            return;
        }
        
        // Group by Client
        const clientMap = new Map(); // key: clientName, value: { clientName, titleMap: Map }
        for (const row of rows) {
            const client = row.clientName;
            if (!clientMap.has(client)) {
                clientMap.set(client, { clientName: client, titleMap: new Map() });
            }
            const clientEntry = clientMap.get(client);
            const title = row.projectName;
            if (!clientEntry.titleMap.has(title)) {
                clientEntry.titleMap.set(title, { titleName: title, subtitleMap: new Map() });
            }
            const titleEntry = clientEntry.titleMap.get(title);
            const subtitle = row.subtitle;
            if (!titleEntry.subtitleMap.has(subtitle)) {
                titleEntry.subtitleMap.set(subtitle, { subtitleName: subtitle, partRows: [] });
            }
            const subtitleEntry = titleEntry.subtitleMap.get(subtitle);
            subtitleEntry.partRows.push(row);
        }
        
        // Build HTML with proper rowspan
        let html = '';
        for (const clientEntry of clientMap.values()) {
            const clientRowsTotal = Array.from(clientEntry.titleMap.values()).reduce((sum, titleEntry) => {
                return sum + Array.from(titleEntry.subtitleMap.values()).reduce((s, subEntry) => s + subEntry.partRows.length, 0);
            }, 0);
            let clientRowspan = clientRowsTotal;
            
            let firstClientRow = true;
            for (const titleEntry of clientEntry.titleMap.values()) {
                const titleRowsTotal = Array.from(titleEntry.subtitleMap.values()).reduce((s, subEntry) => s + subEntry.partRows.length, 0);
                let firstTitleRow = true;
                for (const subtitleEntry of titleEntry.subtitleMap.values()) {
                    const partRows = subtitleEntry.partRows;
                    const subtitleRowspan = partRows.length;
                    for (let i = 0; i < subtitleRowspan; i++) {
                        const row = partRows[i];
                        html += `<tr class="hover:bg-gray-50 transition">`;
                        if (firstClientRow && i === 0) {
                            html += `<td rowspan="${clientRowspan}" class="font-medium align-top">${escapeHtml(clientEntry.clientName)}</td>`;
                        }
                        if (firstTitleRow && i === 0) {
                            html += `<td rowspan="${titleRowsTotal}" class="font-medium align-top">${escapeHtml(titleEntry.titleName)}</td>`;
                        }
                        if (i === 0) {
                            html += `<td rowspan="${subtitleRowspan}" class="text-sm align-top">${escapeHtml(subtitleEntry.subtitleName)}</td>`;
                        }
                        html += `
                            <td class="font-mono text-sm">${escapeHtml(row.drawingNo)}</td>
                            <td class="font-medium">${escapeHtml(row.partName)}</td>
                            <td class="text-right tabular-nums">${row.delivered}</td>
                            <td class="text-right tabular-nums text-emerald-700">${row.accepted}</td>
                            <td class="text-right tabular-nums text-amber-600">${row.rework}</td>
                            <td class="text-right tabular-nums text-red-600">${row.reject}</td>
                            <td class="text-right tabular-nums text-purple-600">${row.conditional}</td>
                        </tr>`;
                    }
                    firstTitleRow = false;
                }
                firstClientRow = false;
            }
        }
        tbody.innerHTML = html;
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Export to Excel (flattened version)
    function exportToExcel() {
        const searchTerm = document.getElementById('searchInput').value;
        const selectedProject = document.getElementById('projectFilterSelect').value;
        let dataToExport = [...allReportRows];
        if (selectedProject) dataToExport = dataToExport.filter(row => row.projectName === selectedProject);
        if (searchTerm) dataToExport = dataToExport.filter(row => row.rawSearch.includes(searchTerm.toLowerCase()));
        
        if (dataToExport.length === 0) {
            alert('No data to export. Adjust filters.');
            return;
        }
        
        const headers = ['Client Name', 'Title', 'Subtitle', 'Drawing No.', 'Part Name', 'Delivered Qty', 'Accepted Qty', 'Rework Qty', 'Reject Qty', 'Conditional Accept'];
        const csvRows = [headers.join(',')];
        
        for (const row of dataToExport) {
            const values = [
                `"${(row.clientName || '').replace(/"/g, '""')}"`,
                `"${(row.projectName || '').replace(/"/g, '""')}"`,
                `"${(row.subtitle || '').replace(/"/g, '""')}"`,
                `"${(row.drawingNo || '').replace(/"/g, '""')}"`,
                `"${(row.partName || '').replace(/"/g, '""')}"`,
                row.delivered,
                row.accepted,
                row.rework,
                row.reject,
                row.conditional
            ];
            csvRows.push(values.join(','));
        }
        
        const blob = new Blob(["\uFEFF" + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.setAttribute('download', 'inspection_report.xls');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }
    
    async function copyTableToClipboard() {
        const searchTerm = document.getElementById('searchInput').value;
        const selectedProject = document.getElementById('projectFilterSelect').value;
        let dataToCopy = [...allReportRows];
        if (selectedProject) dataToCopy = dataToCopy.filter(row => row.projectName === selectedProject);
        if (searchTerm) dataToCopy = dataToCopy.filter(row => row.rawSearch.includes(searchTerm.toLowerCase()));
        
        if (dataToCopy.length === 0) {
            alert('No data to copy');
            return;
        }
        
        let tsvContent = "Client Name\tTitle\tSubtitle\tDrawing No.\tPart Name\tDelivered Qty\tAccepted Qty\tRework Qty\tReject Qty\tConditional Accept\n";
        for (const row of dataToCopy) {
            tsvContent += `${row.clientName}\t${row.projectName}\t${row.subtitle}\t${row.drawingNo}\t${row.partName}\t${row.delivered}\t${row.accepted}\t${row.rework}\t${row.reject}\t${row.conditional}\n`;
        }
        try {
            await navigator.clipboard.writeText(tsvContent);
            alert('✅ Table copied to clipboard (tab-separated, ready for Excel)');
        } catch (err) {
            alert('❌ Copy failed: ' + err);
        }
    }
    
    function clearFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('projectFilterSelect').value = '';
        applyFilters();
    }
    
    document.getElementById('searchInput').addEventListener('input', () => { if (allReportRows.length) applyFilters(); });
    document.getElementById('projectFilterSelect').addEventListener('change', () => { if (allReportRows.length) applyFilters(); });
    document.getElementById('clearFiltersBtn').addEventListener('click', clearFilters);
    
    fetchReportData();
</script>
</body>
</html>
