<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QC Engineer Login | Amhara Metal Industry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-blue-900">🔧 QC Engineer Login</h1>
        <div class="space-y-4 mt-4">
            <input type="email" id="email" placeholder="Email" class="w-full border p-3 rounded">
            <input type="password" id="password" placeholder="Password" class="w-full border p-3 rounded">
            <button onclick="login()" class="w-full bg-blue-600 text-white py-3 rounded">Login</button>
        </div>
        <div id="errorMsg" class="text-red-500 text-sm mt-4 text-center"></div>
    </div>
</div>
<script>
    const SUPABASE_URL = "https://vlbnjraaowuyrdexhklk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsYm5qcmFhb3d1eXJkZXhoa2xrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTMyNTEsImV4cCI6MjA5NDY2OTI1MX0.pOByJxbMsRQZWgjp7P9bsnsb_AugI67SwAlCXpdpV6U";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) document.getElementById('errorMsg').innerText = error.message;
        else window.location.href = '/index.html';
    }
</script>
</body>
</html>
