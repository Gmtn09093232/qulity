<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QC Rolling Inspection</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

<div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-6">
    <!-- Login Section -->
    <div id="loginSection">
        <h2 class="text-2xl font-bold mb-4">QC Engineer Login</h2>
        <input type="email" id="email" placeholder="Email" class="w-full p-2 border rounded mb-2">
        <input type="password" id="password" placeholder="Password" class="w-full p-2 border rounded mb-2">
        <button onclick="handleLogin()" class="bg-blue-600 text-white px-4 py-2 rounded mr-2">Login</button>
        <button onclick="handleSignup()" class="bg-gray-600 text-white px-4 py-2 rounded">Sign Up</button>
        <div id="loginMessage" class="text-red-500 mt-2"></div>
    </div>

    <!-- Inspection Form (hidden until login) -->
    <div id="inspectionSection" class="hidden">
        <h2 class="text-xl font-bold">Rolling Process Inspection</h2>
        <p>Logged in as: <span id="userEmail"></span> <button onclick="logout()" class="text-red-600 underline">Logout</button></p>
        <hr class="my-3">
        <form id="inspectionForm">
            <!-- simplified fields for testing -->
            <div class="mb-2">
                <label>Operator Name:</label>
                <input type="text" id="operatorName" class="border p-1 w-full">
            </div>
            <div class="mb-2">
                <label>Result:</label>
                <select id="result" class="border p-1">
                    <option>Accepted</option><option>Rework</option><option>Reject</option>
                </select>
            </div>
            <button type="button" onclick="submitInspection()" class="bg-green-600 text-white px-4 py-2 rounded">Save Inspection</button>
        </form>
        <div id="formFeedback" class="mt-3"></div>
        <hr class="my-3">
        <h3 class="font-bold">Previous Inspections</h3>
        <div id="historyList" class="text-sm"></div>
    </div>
</div>

<script>
    // ---------- REPLACE WITH YOUR ACTUAL SUPABASE CREDENTIALS ----------
    const SUPABASE_URL = "https://vlbnjraaowuyrdexhklk.supabase.co";   // CHANGE THIS
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsYm5qcmFhb3d1eXJkZXhoa2xrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTMyNTEsImV4cCI6MjA5NDY2OTI1MX0.pOByJxbMsRQZWgjp7P9bsnsb_AugI67SwAlCXpdpV6U
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    async function handleLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
            document.getElementById('loginMessage').innerText = "Login error: " + error.message;
        } else {
            currentUser = data.user;
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('inspectionSection').classList.remove('hidden');
            document.getElementById('userEmail').innerText = currentUser.email;
            loadHistory();
        }
    }

    async function handleSignup() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) {
            document.getElementById('loginMessage').innerText = "Signup error: " + error.message;
        } else {
            document.getElementById('loginMessage').innerHTML = "Account created! You can now <strong>login</strong>.";
        }
    }

    async function logout() {
        await supabase.auth.signOut();
        currentUser = null;
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('inspectionSection').classList.add('hidden');
        document.getElementById('email').value = '';
        document.getElementById('password').value = '';
        document.getElementById('loginMessage').innerHTML = '';
    }

    async function submitInspection() {
        if (!currentUser) return;
        const operator = document.getElementById('operatorName').value;
        const resultVal = document.getElementById('result').value;
        const payload = {
            user_id: currentUser.id,
            username: currentUser.email,
            operator_name: operator,
            result: resultVal,
            submitted_at: new Date()
        };
        const { data, error } = await supabase.from('rolling_inspections').insert([payload]);
        if (error) {
            document.getElementById('formFeedback').innerHTML = `<span class="text-red-600">Error: ${error.message}</span>`;
        } else {
            document.getElementById('formFeedback').innerHTML = '<span class="text-green-600">Saved successfully!</span>';
            loadHistory();
        }
    }

    async function loadHistory() {
        if (!currentUser) return;
        const { data, error } = await supabase
            .from('rolling_inspections')
            .select('operator_name, result, submitted_at')
            .eq('user_id', currentUser.id)
            .order('submitted_at', { ascending: false })
            .limit(5);
        if (error) console.error(error);
        const historyDiv = document.getElementById('historyList');
        if (data && data.length) {
            historyDiv.innerHTML = data.map(row => `<div>${new Date(row.submitted_at).toLocaleString()} - ${row.operator_name} (${row.result})</div>`).join('');
        } else {
            historyDiv.innerHTML = '<div>No inspections yet.</div>';
        }
    }

    // Auto-check existing session
    window.onload = async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (session?.user) {
            currentUser = session.user;
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('inspectionSection').classList.remove('hidden');
            document.getElementById('userEmail').innerText = currentUser.email;
            loadHistory();
        }
    };
</script>
</body>
</html>
